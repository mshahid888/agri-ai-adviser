services:
  agri-ai-api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - AGRI_AI_MODEL=${AGRI_AI_MODEL:-gemini/gemini-3.1-flash-lite}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - API_KEY=${API_KEY:-}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AGENT_DB_PATH=/app/data/agent.db
    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
